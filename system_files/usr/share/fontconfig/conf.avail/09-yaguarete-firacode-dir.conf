<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Make /usr/share/fonts/firacode-nerd-fonts a first-class font directory.

  This should be unnecessary: /etc/fonts/fonts.conf already carries
  <dir>/usr/share/fonts</dir>, and fontconfig walks it recursively. On an
  ostree system it is necessary anyway, and the reason is worth writing
  down because it will bite the next font we add.

  fontconfig caches a directory's list of SUBDIRECTORIES, and validates
  that cache against the directory's mtime. Our layer adds a new subdir
  under /usr/share/fonts, but:

    - the cache for the parent was baked into the BASE Bazzite image,
      before our subdir existed, so it does not enumerate it
    - ostree normalises every mtime in the image to 0, so fontconfig
      cannot tell the parent changed and trusts the stale listing
    - /usr/lib/fontconfig/cache is read-only on the deployed system, so
      `fc-cache -f` at runtime cannot repair it either

  Net effect, observed on a real install of 44.20260810: the 18 font
  files were present, valid (fc-query read them fine) and completely
  invisible to fc-list and fc-match, which answered 'Noto Sans'.

  Naming the directory explicitly here removes the parent's subdirectory
  listing from the equation entirely. Verified on that same machine: with
  a config carrying this <dir>, fc-list reports 18 fonts and fc-match
  resolves 'FiraCode Nerd Font'.

  install-fonts.sh also runs a full `fc-cache -f` at build time, which
  regenerates the parent listing while /usr is still writable. That is
  the root-cause repair; this file is the belt to its braces, and the one
  half that was proven on hardware before shipping.
-->
<fontconfig>
  <dir>/usr/share/fonts/firacode-nerd-fonts</dir>
</fontconfig>
