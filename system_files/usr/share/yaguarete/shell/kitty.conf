# YaguareteOS — kitty configuration.
#
# Single source of truth for two destinations:
#   - /etc/skel/.config/kitty/kitty.conf  (new accounts, copied in build.sh)
#   - ~/.config/kitty/kitty.conf          (written by `ujust yaguarete-setup-shell`)
#
# Colours match the YaguareteOS Konsole profile and KDE colour scheme, so
# the two terminals do not look like they came from different distros.

# ============ SHELL ============
# zsh is also the default login shell for new accounts
# (/etc/default/useradd). Naming it here means kitty gets zsh even on an
# account whose login shell was never changed.
shell /usr/bin/zsh

# ============ FONT ============
# FiraCode Nerd Font, not the Mono face: kitty renders the double-width
# Nerd Font icon glyphs correctly, and the proportional-icon faces are
# what Powerlevel10k expects. Konsole uses "... Mono" instead — see
# build_files/install-fonts.sh for why the two differ.
font_family      FiraCode Nerd Font
font_size        10.0

# Ligatures are the reason FiraCode was chosen (#254). kitty renders them
# by default; this makes the intent explicit and survives a future default
# flip. Under the cursor they stay disabled, where a merged glyph would
# hide which character you are actually on.
disable_ligatures cursor

# ============ WINDOW ============
# Handhelds: kitty clamps these to the available screen area, so a 7"
# display gets a full-screen window rather than one hanging off the edge.
initial_window_width  111c
initial_window_height 25c

background_opacity 0.9
enable_audio_bell no

# ============ BREEZE (KDE) PALETTE ============
foreground #fcfcfc
background #232627

# Normal
color0  #232627
color1  #ed1515
color2  #11d116
color3  #f67400
color4  #1d99f3
color5  #9b59b6
color6  #1abc9c
color7  #fcfcfc

# Bright
color8  #7f8c8d
color9  #c0392b
color10 #1cdc9a
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff

cursor #fcfcfc
selection_foreground #232627
selection_background #fcfcfc

# ============ LAYOUT ============
enabled_layouts splits,stack

# ============ KEY BINDINGS ============
# Tabs
map alt+t new_tab_with_cwd
map alt+w close_tab
map alt+, previous_tab
map alt+. next_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# Splits
map alt+v launch --location=vsplit --cwd=current
map alt+h launch --location=hsplit --cwd=current
map alt+shift+w close_window

# Move between splits
map alt+left neighboring_window left
map alt+right neighboring_window right
map alt+up neighboring_window up
map alt+down neighboring_window down

# Zoom the current split
map alt+z toggle_layout stack

# Resize splits
map alt+shift+left resize_window narrower
map alt+shift+right resize_window wider
map alt+shift+up resize_window taller
map alt+shift+down resize_window shorter

# Show the shortcut reference
map alt+? show_kitty_doc keyboard-shortcuts

# ============ TAB BAR ============
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #232627
active_tab_background   #1d99f3
inactive_tab_foreground #fcfcfc
inactive_tab_background #232627
