          - id: "update"
            label: "Update"
            script: 'ujust update-yryvu; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "remove"
            label: "Remove"
            script: 'ujust remove-yryvu; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "tatu"
        title: "Tatu (Steam backlog tracker)"
        description: "Install Tatu, the Steam backlog tracker by lobinuxsoft (Tauri 2 frontend). AppImage from GitHub Releases, SHA256 verified; the legacy Game Progress Tracker name is rewritten to Tatu in the KDE launcher. The Aurora-style Win32 cheats bridge is a separate Steam compat tool — see lobinuxsoft/tatu README."
        default: false
        status_script: '[[ -f "$HOME/Applications/Tatu.AppImage" ]] && echo "install" || echo "remove"'
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-tatu; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'ujust update-tatu; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "remove"
            label: "Remove"
            script: 'ujust remove-tatu; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "eden"
        title: "Eden (Switch Emulator)"
        description: "Install Eden Nintendo Switch emulator. Optionally downloads firmware 22.x (THZoria) and prod.keys v20.3.0 (ProdKeys.net) for game compatibility. Auto-registers a Steam ROM Manager parser if EmuDeck is detected."
        default: false
        status_script: '[[ -f "$HOME/Applications/Eden.AppImage" ]] && echo "install" || echo "remove"'
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-eden; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'ujust update-eden; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "remove"
            label: "Remove"
            script: 'ujust remove-eden; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "antigravity-ide"
        title: "Antigravity IDE (Google — Gemini)"
        description: "Install Google's Antigravity IDE from the official Google Cloud Artifact Registry APT repo, with SHA256 verification. Not to be confused with YaguareteOS' built-in Antigravity assistant."
        default: false
        status_script: '[[ -f /opt/antigravity/VERSION ]] && echo "install" || echo "remove"'
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-antigravity-ide; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'ujust update-antigravity-ide; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "remove"
            label: "Remove"
            script: 'ujust remove-antigravity-ide; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "antigravity-cli"
        title: "Antigravity CLI (Google — Gemini)"
        description: "Install Google's Antigravity CLI assistant via the upstream install.sh script (inspect-then-run pattern). Not to be confused with YaguareteOS' built-in Antigravity assistant."
        default: false
        status_script: 'command -v agy >/dev/null 2>&1 && echo "install" || echo "remove"'
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-antigravity-cli; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'ujust update-antigravity-cli; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "remove"
            label: "Remove"
            script: 'ujust remove-antigravity-cli; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
  - title: "Creative Apps"
