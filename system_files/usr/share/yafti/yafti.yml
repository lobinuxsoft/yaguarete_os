  - title: "Manage PC"
    description: "System updates and configuration"
    actions:
      - id: "update-bazzite"
        title: "Update YaguareteOS and Apps"
        description: "Updates YaguareteOS, Flatpaks, firmware, and more"
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'ujust update'"
      - id: "rebase-yaguarete-stable"
        title: "Rebase YaguareteOS (stable)"
        description: "Rebase to the stable channel -- the tested one. Resolves the image from image-info.json (vendor included) and keeps whichever verification mode the booted deployment uses, which 'brh rebase' does not: it hardcodes ghcr.io/ublue-os and would send this image to a repository that does not exist."
        script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-rebase stable'"
      - id: "rebase-yaguarete-testing"
        title: "Rebase YaguareteOS (testing)"
        description: "Rebase to the testing channel: what is being validated before it becomes stable. Reboot required after applying."
        script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-rebase testing'"
      - id: "rebase-yaguarete-unstable"
        title: "Rebase YaguareteOS (unstable)"
        description: "Rebase to the unstable channel: every merge, built but not validated on hardware. This is where new work lands first. Expect breakage; 'ujust yaguarete-rebase stable' takes you back."
        script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-rebase unstable'"
      - id: "rollback-bazzite"
        title: "Rollback YaguareteOS"
        description: "Rollback to the previous YaguareteOS deployment"
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'brh rollback -y && reboot'"
      - id: "verify-image"
        title: "Verify System Image"
        description: "Detects if you are on an unverified official image and rebases you to the signed version."
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'ujust verify-image'"
      - id: "reset-bazzite"
        title: "Reset YaguareteOS"
        description: "Reset YaguareteOS layering to Default (Only resets layers NOT user data)" 
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'rpm-ostree reset'"
      - id: "cancel-pending-deployment"
        title: "Cancel Pending Deployment"
        description: "Remove a pending rpm-ostree deployment that you do not want to boot into."
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'rpm-ostree cleanup -p'"
      - id: "Reboot to UEFI"
        title: "Reboot to UEFI"
        description: "Reboot into the UEFI settings menu, useful for changing boot order or other firmware settings."
        default: false
        script: "/usr/libexec/yaguarete/portal-run 'systemctl reboot --firmware-setup'"
