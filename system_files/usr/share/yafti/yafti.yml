        description: "IDE manager for JetBrains products"
        default: false
        status_script: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew list --cask 2>/dev/null | grep -qx jetbrains-toolbox-linux && echo "install" || echo "uninstall"'
