            script: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew tap ublue-os/tap && brew install --cask jetbrains-toolbox-linux; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" && brew upgrade --cask jetbrains-toolbox-linux; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
