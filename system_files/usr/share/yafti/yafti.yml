      - id: "automounting"
        title: "Automounting"
        description: "Enable or disable automounting of labeled BTRFS/EXT4 partitions under /run/media/system."
        default: false
        status_script: "ujust enable-automounting status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust enable-automounting enable"
          - id: "disable"
            label: "Disable"
            script: "ujust enable-automounting disable"
      - id: "steamos-automount"
        title: "SteamOS Automounting"
        description: "Enable or disable SteamOS automounting, useful when NTFS partitions get mounted automatically."
        default: false
        status_script: "ujust enable-steamos-automount status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust enable-steamos-automount enable"
          - id: "disable"
            label: "Disable"
            script: "ujust enable-steamos-automount disable"
      - id: "wake-on-lan"
        title: "Wake-on-LAN"
        description: "Enable Wake-on-LAN functionality to power on your device remotely"
        default: false
        status_script: "ujust toggle-wol status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust toggle-wol enable"
          - id: "disable"
            label: "Disable"
            script: "ujust toggle-wol disable"
          - id: "force-enable"
            label: "Force Enable"
            script: "ujust toggle-wol force-enable"
      - id: "cec-sleep-standby"
        title: "CEC Sleep Standby"
        description: "Put TV to standby when system sleeps via HDMI-CEC. Requires a CEC-compatible Device, or Pulse 8 HDMI-CEC adapter."
        default: false
        status_script: "ujust toggle-cec-sleep status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust toggle-cec-sleep enable"
          - id: "disable"
            label: "Disable"
            script: "ujust toggle-cec-sleep disable"
      - id: "steam-icons"
        title: "Clean Steam Shortcuts"
        description: "Automatically removes Steam shortcuts from the desktop on boot, useful for keeping the desktop clean when installing games via game mode."
        default: false
        status_script: "ujust steam-icons status"
        options:
          - id: "remove"
            label: "Remove Now"
            script: "ujust steam-icons remove"
          - id: "enable"
            label: "Enable Auto-Cleanup"
            script: "ujust steam-icons enable"
          - id: "disable"
            label: "Disable Auto-Cleanup"
            script: "ujust steam-icons disable"
      - id: "opentabletdriver"
        title: "OpenTabletDriver"
        description: "Open source, cross-platform, user-mode tablet driver"
        default: false
        status_script: "ujust install-opentabletdriver status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust install-opentabletdriver install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust install-opentabletdriver uninstall"
      - id: "ssh-service"
        title: "SSH Service"
        description: "Enable SSH remote access service on boot"
        default: false
        status_script: "ujust toggle-ssh status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust toggle-ssh enable"
          - id: "disable"
            label: "Disable"
            script: "ujust toggle-ssh disable"
      - id: "yaguarete-fsr4"
        title: "Global FSR4 Upgrade (auto-detect GPU)"
        description: "Enable or disable the Proton FSR4 upgrade. Auto-detects RDNA 3 / 3.5 (FP8 emulation, requires Proton GE / EM) vs RDNA 4 (native, Proton 10+) and applies the matching env flag. Logs every step to 'journalctl --user -t yaguarete-fsr4' and validates the flag file actually landed on disk (Bazzite's recipe silently no-ops when yafti strips HOME from the subprocess env)."
        default: false
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust yaguarete-fsr4 enable"
          - id: "disable"
            label: "Disable"
            script: "ujust yaguarete-fsr4 disable"
      - id: "global-dlss"
        title: "Global DLSS Upgrade"
        description: "Enable or disable the global Proton DLSS upgrade, which updates DLSS DLLs. Only compatible with Proton GE, Proton EM, or similar forks."
        default: false
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust global-dlss enable"
          - id: "disable"
            label: "Disable"
            script: "ujust global-dlss disable"
      - id: "reisub"
        title: "REISUB"
        description: "Toggle the Magic SysRq key and allow using the REISUB shortcut to force-reboot your computer slightly more safely. Note that it is insecure to have it enabled since you can use it to bypass some stuff"
        default: false
        status_script: "ujust toggle-reisub status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust toggle-reisub enable"
          - id: "disable"
            label: "Disable"
            script: "ujust toggle-reisub disable"
