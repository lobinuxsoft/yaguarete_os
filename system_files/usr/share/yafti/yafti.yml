title: Portal YaguareteOS
# Run-once gating. yafti writes a sha256 of this config to
# ~/.config/yafti/last-run when the user reaches the final screen
# (save_state: last-screen) and silently skips on subsequent launches
# when mode = run-once. The XDG autostart entry shipped under
# /etc/xdg/autostart/yaguarete-firstboot.desktop relies on this guard;
# manual launches via the Apps menu use yafti_gtk.py which ignores
# the guard on purpose (user explicitly asked to open the portal).
properties:
  mode: run-once
  save_state: last-screen
  path: ~/.config/yafti/last-run
screens:
  - title: "App Install"
    description: "Core system components and utilities"
    actions:
      - id: "decky-loader"
        title: "Decky Loader"
        description: "A plugin loader for the Steam Deck"
        default: false
        status_script: "ujust setup-decky status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust setup-decky install"
          - id: "install-prerelease"
            label: "Install Prerelease"
            script: "ujust setup-decky install-prerelease"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust setup-decky uninstall"
      - id: "decky-lossless-scaling"
        title: "Decky Lossless Scaling"
        description: "A Decky plugin for lossless scaling compatibility in Linux"
        default: false
        status_script: "ujust get-decky-lossless-scaling status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust get-decky-lossless-scaling install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust get-decky-lossless-scaling uninstall"
      - id: "lsfg-vk"
        title: "Lossless Scaling Vulkan Layer"
        description: "Install the lsfg-vk Vulkan layer for Lossless Scaling compatibility in Linux."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: 'ujust get-lsfg install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust get-lsfg uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "boxtron"
        title: "Boxtron"
        description: "Installs Boxtron on a Fedora distrobox and exports it."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-boxtron install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust install-boxtron uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "emudeck"
        title: "EmuDeck"
        description: "A utility for installing and configuring emulators on the Steam Deck"
        default: false
        status_script: "ujust get-emudeck status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust get-emudeck install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust get-emudeck uninstall"
      - id: "sunshine"
        title: "Sunshine"
        description: "A self-hosted game stream host for Moonlight"
        default: false
        status_script: "ujust setup-sunshine status"
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust setup-sunshine enable"
          - id: "enable-beta"
            label: "Enable Beta"
            script: "ujust setup-sunshine enable-beta"
          - id: "update"
            label: "Update"
            script: "ujust setup-sunshine update"
          - id: "disable"
            label: "Disable Service"
            script: "ujust setup-sunshine disable"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust setup-sunshine uninstall"
          - id: "portal"
            label: "Open Portal"
            script: "ujust setup-sunshine portal"
      - id: "waydroid"
        title: "Waydroid"
        description: "Android app compatibility layer for Linux"
        default: false
        options:
          - id: "init"
            label: "Initialize"
            script: "ujust configure-waydroid init"
          - id: "configure"
            label: "Configure"
            script: "ujust configure-waydroid configure"
          - id: "gpu"
            label: "Select GPU"
            script: "ujust configure-waydroid gpu"
          - id: "reset"
            label: "Reset"
            script: "ujust configure-waydroid reset"
          - id: "helper"
            label: "Install Helper"
            script: "ujust configure-waydroid helper"
      - id: "coolercontrol"
        title: "CoolerControl"
        description: "View sensors and create fan and pump profiles from available temperature sensors."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-coolercontrol install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust install-coolercontrol uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "displaylink"
        title: "DisplayLink"
        description: "Install DisplayLink support for laptop docks and USB display adapters."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: 'ujust install-displaylink install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust install-displaylink uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "openrazer"
        title: "OpenRazer"
        description: "Install OpenRazer support for Razer gaming hardware."
        default: false
        options:
          - id: "install-razer-genie"
            label: "Install with Razer Genie"
            script: 'ujust install-openrazer install-razer-genie; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "install-polychromatic"
            label: "Install with Polychromatic"
            script: 'ujust install-openrazer install-polychromatic; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "install"
            label: "Install Without Frontend"
            script: 'ujust install-openrazer install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust install-openrazer uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "openrgb"
        title: "OpenRGB"
        description: "Open source RGB lighting control that doesn't depend on manufacturer software"
        default: false
        status_script: "ujust install-openrgb status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust install-openrgb install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust install-openrgb uninstall"
      - id: "resilio-sync"
        title: "Resilio Sync"
        description: "A file synchronization utility powered by BitTorrent"
        default: false
        status_script: "ujust install-resilio-sync status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust install-resilio-sync install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust install-resilio-sync uninstall"
      - id: "davinci-resolve"
        title: "DaVinci Resolve"
        description: "Install or remove DaVinci Resolve through davincibox."
        default: false
        options:
          - id: "install"
            label: "Install/Upgrade"
            script: 'ujust install-davinci install; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'ujust install-davinci uninstall; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "tailscale"
        title: "Tailscale"
        description: "Enable or disable the Tailscale service for mesh VPN support."
        default: false
        options:
          - id: "enable"
            label: "Enable"
            script: "ujust enable-tailscale"
          - id: "disable"
            label: "Disable"
            script: "sudo systemctl disable --now tailscaled.service"
      - id: "steamcmd"
        title: "SteamCMD"
        description: "Command-line version of the Steam client for dedicated servers and game downloads"
        default: false
        status_script: "ujust get-steamcmd status"
        options:
          - id: "install"
            label: "Install"
            script: "ujust get-steamcmd install"
          - id: "uninstall"
            label: "Uninstall"
            script: "ujust get-steamcmd uninstall"
      - id: "lact"
        title: "LACT (Linux AMDGPU Controller)"
        description: "Manual control panel for AMD GPUs: fan curve, overclock/undervolt, power profiles, real-time metrics. Cross-variant (desktop + handheld). AMD only — no-op on NVIDIA variants."
        default: false
        status_script: 'flatpak info --user io.github.ilya_zlobintsev.LACT >/dev/null 2>&1 && echo "install" || echo "uninstall"'
        options:
          - id: "install"
            label: "Install"
            script: 'flatpak install --user -y flathub io.github.ilya_zlobintsev.LACT; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'flatpak update --user -y io.github.ilya_zlobintsev.LACT; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'flatpak uninstall --user -y --noninteractive io.github.ilya_zlobintsev.LACT; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
      - id: "rssguard"
        title: "RSS Guard (feed reader)"
        description: "Qt6 RSS/Atom/JSON Feed reader with native KDE integration. Supports sync protocols (TT-RSS, Nextcloud News, Inoreader). Desktop notifications, categories, filtering rules. GPL, no telemetry, no cloud lock-in. Recomendado para trackear releases upstream (Bazzite, Fedora, etc.) sin GitHub Watch público."
        default: false
        status_script: 'flatpak info --user io.github.martinrotter.rssguard >/dev/null 2>&1 && echo "install" || echo "uninstall"'
        options:
          - id: "install"
            label: "Install"
            script: 'flatpak install --user -y flathub io.github.martinrotter.rssguard; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'flatpak update --user -y io.github.martinrotter.rssguard; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "uninstall"
            label: "Uninstall"
            script: 'flatpak uninstall --user -y --noninteractive io.github.martinrotter.rssguard; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
  - title: "Yaguareté Apps"
    description: "Custom installers maintained by YaguareteOS (gaming and dev tools)"
    actions:
      - id: "yryvu"
        title: "Yryvu (Git client)"
        description: "Install Yryvu, a Tauri 2 + SolidJS Git GUI by lobinuxsoft. AppImage from GitHub Releases, SHA256 verified, registered as a KDE launcher."
        default: false
