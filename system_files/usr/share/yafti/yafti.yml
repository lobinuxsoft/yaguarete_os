      - id: "blender"
        title: "Blender"
        description: "3D modeling, animation, and rendering"
        default: false
        status_script: 'flatpak info --user org.blender.Blender >/dev/null 2>&1 && echo "install" || echo "uninstall"'
        options:
          - id: "install"
            label: "Install"
            script: 'flatpak install --user -y flathub org.blender.Blender; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
          - id: "update"
            label: "Update"
            script: 'flatpak update --user -y org.blender.Blender; status=$?; echo; echo "Press Enter to close..."; read -r _; exit $status'
