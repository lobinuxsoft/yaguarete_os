title: Portal YaguareteOS
# Run-once gating. yafti writes a sha256 of this config to
# ~/.config/yafti/last-run when the user reaches the final screen
# (save_state: last-screen) and silently skips on subsequent launches
# when mode = run-once. The XDG autostart entry shipped under
# /etc/xdg/autostart/yaguarete-firstboot.desktop relies on this guard;
# manual launches via the Apps menu use yafti_gtk.py which ignores
# the guard on purpose (user explicitly asked to open the portal).
properties:
  mode: run-once
  save_state: last-screen
  path: ~/.config/yafti/last-run
screens:
  - title: "App Install"
    description: "Core system components and utilities"
    actions:
      - id: "decky-loader"
        title: "Decky Loader"
        description: "A plugin loader for the Steam Deck"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust yaguarete-setup-decky status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-decky install'"
          - id: "install-prerelease"
            label: "Install Prerelease"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-decky install-prerelease'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-decky uninstall'"
      - id: "opengamepadui-overlay"
        title: "OpenGamepadUI overlay (Game Mode)"
        description: "Choose which Quick Access Menu the handheld buttons reach. Enabled is Bazzite's default on this hardware: the session is 'Steam Big Picture Plus', and OpenGamepadUI answers Guide+East with its own panel before Steam sees it. Disabled turns that session into plain Steam, so the Turbo button opens Steam's own QAM -- the one with the TDP, framerate and scaling tabs. Our InputPlumber drop-in targets a Steam Deck controller, which only has a real Quick Access button for Steam to receive when this is disabled. Log out and back in after changing it."
        default: false
        options:
          - id: "disable"
            label: "Disable (use Steam's QAM)"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-opengamepadui disable'"
          - id: "enable"
            label: "Enable (use OpenGamepadUI's panel)"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-opengamepadui enable'"
      - id: "yaguarete-decky-vram"
        title: "Yaguarete VRAM (Decky plugin)"
        description: "Our own Decky plugin: choose how much system RAM the GPU may map as graphics memory (GTT) on AMD APUs, from Game Mode instead of a terminal. Same knob as 'ujust yaguarete-vram', with the same 6 GiB floor left to the OS. Decky's backend runs as root, which is what lets it stage the kernel argument at all. Needs Decky Loader installed first; the value applies on the next reboot."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust yaguarete-decky-vram status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-decky-vram install'"
          - id: "remove"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-decky-vram remove'"
      - id: "yaguarete-decky-tdp"
        title: "Yaguarete TDP (Decky plugin)"
        description: "Our own Decky plugin: sets the sustained power budget on AMD APUs from Game Mode. Exists because PowerStation links RyzenAdj statically, pinned to before Strix Point support existed, so Steam's own QAM slider shows a range and does nothing on this silicon (ShadowBlip/PowerStation#41). Talks to the system's current libryzenadj.so directly. STOPGAP: remove once #41 ships upstream. Needs Decky Loader installed first."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust yaguarete-decky-tdp status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-decky-tdp install'"
          - id: "remove"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-decky-tdp remove'"
      - id: "yaguarete-mako"
        title: "MAKO — Frame Generation (Lossless Scaling)"
        description: "Vulkan-powered frame generation for Linux gaming, as a Decky plugin plus a renderer layer. MAKO is the continuation of the two entries this replaces: upstream states that 'Decky LSFG-VK Experimental and LSFG-VK Experimental are now MAKO'. REQUIRES Lossless Scaling bought on Steam — MAKO needs its Lossless.dll and does not bundle it, so without that purchase the plugin installs and does nothing. Needs Decky Loader first. Installing here skips Decky's Developer Mode entirely; afterwards, press 'Install MAKO Renderer' inside the plugin and add $HOME/.local/bin/mako-run %command% to a game's launch options. x86_64 only."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust yaguarete-mako status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-mako install'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-mako update'"
          - id: "remove"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-mako remove'"
      - id: "boxtron"
        title: "Boxtron"
        description: "Installs Boxtron on a Fedora distrobox and exports it."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-boxtron install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-boxtron uninstall'"
      - id: "emudeck"
        title: "EmuDeck"
        description: "A utility for installing and configuring emulators on the Steam Deck"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust get-emudeck status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust get-emudeck install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust get-emudeck uninstall'"
      - id: "sunshine"
        title: "Sunshine"
        description: "A self-hosted game stream host for Moonlight"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust setup-sunshine status'"
        options:
          - id: "enable"
            label: "Enable"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine enable'"
          - id: "enable-beta"
            label: "Enable Beta"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine enable-beta'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine update'"
          - id: "disable"
            label: "Disable Service"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine disable'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine uninstall'"
          - id: "portal"
            label: "Open Portal"
            script: "/usr/libexec/yaguarete/portal-run 'ujust setup-sunshine portal'"
      - id: "waydroid"
        title: "Waydroid"
        description: "Android app compatibility layer for Linux"
        default: false
        options:
          - id: "init"
            label: "Initialize"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-waydroid init'"
          - id: "configure"
            label: "Configure"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-waydroid configure'"
          - id: "gpu"
            label: "Select GPU"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-waydroid gpu'"
          - id: "reset"
            label: "Reset"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-waydroid reset'"
          - id: "helper"
            label: "Install Helper"
            script: "/usr/libexec/yaguarete/portal-run 'ujust configure-waydroid helper'"
      - id: "coolercontrol"
        title: "CoolerControl"
        description: "View sensors and create fan and pump profiles from available temperature sensors."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-coolercontrol install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-coolercontrol uninstall'"
      - id: "displaylink"
        title: "DisplayLink"
        description: "Install DisplayLink support for laptop docks and USB display adapters."
        default: false
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-displaylink install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-displaylink uninstall'"
      - id: "openrazer"
        title: "OpenRazer"
        description: "Install OpenRazer support for Razer gaming hardware."
        default: false
        options:
          - id: "install-razer-genie"
            label: "Install with Razer Genie"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-openrazer install-razer-genie'"
          - id: "install-polychromatic"
            label: "Install with Polychromatic"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-openrazer install-polychromatic'"
          - id: "install"
            label: "Install Without Frontend"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-openrazer install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-openrazer uninstall'"
      - id: "openrgb"
        title: "OpenRGB"
        description: "Open source RGB lighting control that doesn't depend on manufacturer software"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust openrgb status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust openrgb install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust openrgb uninstall'"
      - id: "resilio-sync"
        title: "Resilio Sync"
        description: "A file synchronization utility powered by BitTorrent"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust resilio-sync status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust resilio-sync install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust resilio-sync uninstall'"
      - id: "davinci-resolve"
        title: "DaVinci Resolve"
        description: "Install or remove DaVinci Resolve through davincibox."
        default: false
        options:
          - id: "install"
            label: "Install/Upgrade"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-resolve install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-resolve uninstall'"
      - id: "tailscale"
        title: "Tailscale"
        description: "Enable or disable the Tailscale service for mesh VPN support."
        default: false
        options:
          - id: "enable"
            label: "Enable"
            script: "/usr/libexec/yaguarete/portal-run 'ujust tailscale'"
          - id: "disable"
            label: "Disable"
            script: "/usr/libexec/yaguarete/portal-run 'sudo systemctl disable --now tailscaled.service'"
      - id: "steamcmd"
        title: "SteamCMD"
        description: "Command-line version of the Steam client for dedicated servers and game downloads"
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust get-steamcmd status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust get-steamcmd install'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'ujust get-steamcmd uninstall'"
      - id: "lact"
        title: "LACT (Linux AMDGPU Controller)"
        description: "Manual control panel for AMD GPUs: fan curve, overclock/undervolt, power profiles, real-time metrics. Cross-variant (desktop + handheld). AMD only — no-op on NVIDIA variants."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'flatpak info --system io.github.ilya_zlobintsev.LACT >/dev/null 2>&1 && echo \"install\" || echo \"uninstall\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak install --system -y flathub io.github.ilya_zlobintsev.LACT'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak update --system -y io.github.ilya_zlobintsev.LACT'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak uninstall --system -y --noninteractive io.github.ilya_zlobintsev.LACT'"
      - id: "rssguard"
        title: "RSS Guard (feed reader)"
        description: "Qt6 RSS/Atom/JSON Feed reader with native KDE integration. Supports sync protocols (TT-RSS, Nextcloud News, Inoreader). Desktop notifications, categories, filtering rules. GPL, no telemetry, no cloud lock-in. Recomendado para trackear releases upstream (Bazzite, Fedora, etc.) sin GitHub Watch público."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'flatpak info --system io.github.martinrotter.rssguard >/dev/null 2>&1 && echo \"install\" || echo \"uninstall\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak install --system -y flathub io.github.martinrotter.rssguard'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak update --system -y io.github.martinrotter.rssguard'"
          - id: "uninstall"
            label: "Uninstall"
            script: "/usr/libexec/yaguarete/portal-run 'sudo -A flatpak uninstall --system -y --noninteractive io.github.martinrotter.rssguard'"
  - title: "Yaguareté Apps"
    description: "Custom installers maintained by YaguareteOS (gaming and dev tools)"
    actions:
      - id: "yryvu"
        title: "Yryvu (Git client)"
        description: "Install Yryvu, a Tauri 2 + SolidJS Git GUI by lobinuxsoft. AppImage from GitHub Releases, SHA256 verified, registered as a KDE launcher."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet '[[ -f \"$HOME/Applications/Yryvu.AppImage\" ]] && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-yryvu'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-yryvu'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-yryvu'"
      - id: "tatu"
        title: "Tatu (Steam backlog tracker)"
        description: "Install Tatu, the Steam backlog tracker by lobinuxsoft (Tauri 2 frontend). AppImage from GitHub Releases, SHA256 verified; the legacy Game Progress Tracker name is rewritten to Tatu in the KDE launcher. The Aurora-style Win32 cheats bridge is a separate Steam compat tool — see lobinuxsoft/tatu README."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet '[[ -f \"$HOME/Applications/Tatu.AppImage\" ]] && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-tatu'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-tatu'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-tatu'"
      - id: "eden"
        title: "Eden (Switch Emulator)"
        description: "Install Eden Nintendo Switch emulator. Optionally downloads firmware 22.x (THZoria) and prod.keys v20.3.0 (ProdKeys.net) for game compatibility. Auto-registers a Steam ROM Manager parser if EmuDeck is detected."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet '[[ -f \"$HOME/Applications/Eden.AppImage\" ]] && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-eden'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-eden'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-eden'"
      - id: "antigravity-ide"
        title: "Antigravity IDE (Google — Gemini)"
        description: "Install Google's Antigravity IDE from the official Google Cloud Artifact Registry APT repo, with SHA256 verification. Not to be confused with YaguareteOS' built-in Antigravity assistant."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet '[[ -f /opt/antigravity/VERSION ]] && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-antigravity-ide'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-antigravity-ide'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-antigravity-ide'"
      - id: "antigravity-cli"
        title: "Antigravity CLI (Google — Gemini)"
        description: "Install Google's Antigravity CLI assistant via the upstream install.sh script (inspect-then-run pattern). Not to be confused with YaguareteOS' built-in Antigravity assistant."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'command -v agy >/dev/null 2>&1 && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-antigravity-cli'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-antigravity-cli'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-antigravity-cli'"
      - id: "shell-environment"
        title: "Shell environment (zsh + Powerlevel10k + kitty)"
        description: "Set up the YaguareteOS shell for your account: oh-my-zsh, the Powerlevel10k prompt, autosuggestions and syntax highlighting, plus the kitty terminal configuration. kitty, zsh and FiraCode Nerd Font already ship with the image — this fills in the part that lives in your home directory, and makes zsh your login shell. Existing dotfiles are backed up, never overwritten in place. Re-run Install to pull newer theme and plugin versions."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet '[[ -d \"$HOME/.oh-my-zsh\" ]] && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-shell install'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-shell install'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-shell remove'"
      - id: "claude-code"
        title: "Claude Code (Anthropic — Claude)"
        description: "Install Anthropic's Claude Code CLI from the official installer (inspect-then-run, no root, nothing added to the image). Requires an Anthropic account to be usable at all — a Claude subscription or an API key; installing it only puts the binary in place. Sign in afterwards with 'claude auth login'."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'command -v claude >/dev/null 2>&1 && echo \"install\" || echo \"remove\"'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust install-claude-code'"
          - id: "update"
            label: "Update"
            script: "/usr/libexec/yaguarete/portal-run 'ujust update-claude-code'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust remove-claude-code'"
      - id: "local-ai"
        title: "Local AI for VSCode (llama.cpp + Qwen3.5)"
        description: "Run a coding assistant entirely on your own GPU: a llama.cpp server in a container (Vulkan, official upstream image) plus a Qwen3.5 model, wired into VSCode's Continue.dev extension. Nothing leaves the machine and no account is needed. The model is picked for your hardware — 9B on desktop, 4B on handhelds — and is a multi-gigabyte download, asked for before it starts. Install Visual Studio Code first (Brew section)."
        default: false
        status_script: "/usr/libexec/yaguarete/portal-run --quiet 'ujust yaguarete-setup-local-ai status'"
        options:
          - id: "install"
            label: "Install"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-local-ai install'"
          - id: "status"
            label: "Status"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-local-ai status'"
          - id: "remove"
            label: "Remove"
            script: "/usr/libexec/yaguarete/portal-run 'ujust yaguarete-setup-local-ai remove'"
