# Give PowerStation the PCI class it expects for an iGPU, so the TDP slider
# shows up in Steam's QAM. The why is in the script.
#
# PrivateMounts=yes is what keeps this contained: it puts the unit in its own
# mount namespace, so the bind mount the ExecStartPre makes is visible to
# PowerStation and to nothing else, and it disappears when the service stops.
# Without it the fake PCI class would be global.
#
# ExecStartPre is not prefixed with `-` on purpose: the script always exits 0,
# so a real non-zero here means the script itself broke and that is worth
# seeing rather than swallowing.
[Service]
PrivateMounts=yes
ExecStartPre=/usr/libexec/yaguarete/tdp-class-quirk
