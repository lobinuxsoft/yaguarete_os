# Give PowerStation the PCI class it expects for an iGPU, so the TDP slider
# shows up in Steam's QAM. The why is in the script.
#
# The quirk has to *wrap* PowerStation, not precede it. PrivateMounts=yes gives
# every Exec* invocation its own mount namespace rather than one shared by the
# unit, so a bind mount made in an ExecStartPre is gone before ExecStart runs.
# Shipped that way once: the quirk logged success, the mount was real, and
# PowerStation still read 0x038000 from a namespace that never saw it.
#
# So the script mounts and then execs the daemon in the same process. The fake
# class stays confined to PowerStation and dies with the service, which is what
# PrivateMounts was for in the first place.
#
# The empty ExecStart= is required: without it systemd appends rather than
# replaces, and the unit would try to run PowerStation twice.
[Service]
PrivateMounts=yes
ExecStart=
ExecStart=/usr/libexec/yaguarete/tdp-class-quirk /usr/bin/powerstation
