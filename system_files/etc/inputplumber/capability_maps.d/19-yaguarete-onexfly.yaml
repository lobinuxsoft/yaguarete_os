# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v1.json
#
# Capability map for the ONEXPLAYER F1 Pro, replacing upstream's `oxp7`.
#
# Two things are wrong with `oxp7` on this unit, both measured with
# `systemctl stop inputplumber` + `evtest`, one button per press:
#
#   1. Only one label was actually wrong. The manufacturer's own diagram calls
#      the right-hand button "keyboard", which is what upstream called it too;
#      an earlier revision here renamed it to "Orange Button" on the belief the
#      labels were shifted, and that was the wrong half of the correction. What
#      upstream calls "Orange Button (Short Press)" is the small left-hand one.
#
#   2. Turbo had nowhere to land. It goes to `QuickAccess` -- the Steam Deck's
#      "..." button -- and the composite device now targets `deck-uhid`, a real
#      Valve Steam Deck Controller, so there is a genuine button to press.
#
#      An earlier revision sent it to `QuickAccess2` instead, which
#      OpenGamepadUI translates to `Guide`+`East`. That was measured on the
#      device and the chord is emitted perfectly -- seven presses out of seven,
#      80 ms apart. It just never reaches Steam: the `ogui-steam` session calls
#      itself "Gamescope Steam session with OpenGamepadUI QAM", and OGUI treats
#      `Guide`+`East` as its own quick-bar gesture. It answers first, by design.
#
#      Reaching Steam's own QAM therefore takes both halves: this map, and
#      `ujust configure-opengamepadui disable` to make that session plain
#      Steam. Without the second, Turbo opens OGUI's panel no matter what is
#      written here.
#
#   3. The keyboard button aims at `QuickAccess2`, not `Keyboard`, and that
#      gives the unit both panels at once -- one per button:
#
#        Turbo          -> QuickAccess  -> passes through -> Steam's QAM
#        Keyboard       -> QuickAccess2 -> OGUI answers   -> OGUI's panel
#        Small button   -> Guide        -> passes through -> Steam menu
#
#      All three measured in Game Mode on the deck-uhid target. `QuickAccess`
#      has no entry in OGUI's per-device profile, so it reaches the controller;
#      `QuickAccess2` is mapped to `Guide`+`East`, which OGUI treats as its own
#      quick-bar gesture and answers before Steam sees it. Two independent
#      paths, so neither costs the other.
#
#      `Keyboard` was the original target and does nothing: a Steam Deck
#      controller has no keyboard button, so the capability has nothing to
#      become, and OGUI's `ui_osk` never fires. Proven by remapping and
#      measuring /dev/hidraw9 -- zero report changes as `Keyboard`, a clean
#      `byte13: 00 -> 04` as `RightPaddle1`. The chord was never the problem.
#
# `Orange Button (Long Press)` is gone: it emits nothing on this unit. The long
# press is not an input event at all -- the firmware re-enumerates the device
# into its built-in mouse mode -- so the slot is free for Turbo.
#
# Upstream's `M2` entry is gone too. It consumed the pad's own `Guide` button to
# synthesise `RightPaddle1`, and on this unit `BTN_MODE` never fires -- M1/M2
# report over the vendor HID interface instead. Keeping it would spend a real
# button on an event that never arrives.
version: 1
kind: CapabilityMap
name: ONEXPLAYER F1 Pro (YaguareteOS)
id: oxpf1_yaguarete

mapping:
  - name: Turbo
    source_events:
      - keyboard: KeyLeftCtrl
      - keyboard: KeyLeftAlt
      - keyboard: KeyLeftMeta
    target_event:
      gamepad:
        button: QuickAccess

  - name: Keyboard Button
    source_events:
      - keyboard: KeyRightCtrl
      - keyboard: KeyLeftMeta
      - keyboard: KeyO
    target_event:
      gamepad:
        button: QuickAccess2

  - name: Small Button
    source_events:
      - keyboard: KeyLeftMeta
      - keyboard: KeyD
    target_event:
      gamepad:
        button: Guide

  - name: Turbo + Keyboard Button
    source_events:
      - keyboard: KeyLeftMeta
      - keyboard: KeySysrq
    target_event:
      gamepad:
        button: Screenshot

  - name: Keyboard + Small Button
    source_events:
      - keyboard: KeyRightCtrl
      - keyboard: KeyRightAlt
      - keyboard: KeyDelete
    target_event:
      keyboard: KeyF13

filtered_events: []
