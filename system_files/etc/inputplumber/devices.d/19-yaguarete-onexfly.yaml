# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
#
# Composite device for the ONEXPLAYER F1 Pro, so the unit picks up our
# capability map instead of upstream's `oxp7`.
#
# The `19-` prefix sorts ahead of upstream's `50-onexplayer_onexfly.yaml`: the
# first config to claim a source device wins, so upstream's finds nothing left
# to manage. Same convention `bazzite-inputplumber-ignorelist` uses.
#
# `matches` is deliberately narrower than upstream's -- only the F1 Pro, the one
# unit the button labels were actually measured on. Every other F1 variant keeps
# upstream's config untouched.
#
# Remove this file and its capability map to hand the device back to upstream.
version: 1
kind: CompositeDevice
name: ONEXPLAYER ONEXFLY (YaguareteOS)

single_source: false

matches:
  - dmi_data:
      product_name: ONEXPLAYER F1Pro
      sys_vendor: ONE-NETBOOK

source_devices:
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:c4:00.3-4/input0
      handler: event*
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:c7:00.0-4/input0
      handler: event*
  - group: keyboard
    evdev:
      name: AT Translated Set 2 keyboard
      phys_path: isa0060/serio0/input0
      handler: event*
  - group: imu
    iio:
      name: "{i2c-BMI0160:00,bmi260}"

options:
  auto_manage: true

# A Steam Deck controller, because an Xbox pad has no Quick Access button and
# the chord that stands in for one never reaches Steam.
#
# The `ogui-steam` session -- "Steam Big Picture Plus", the default on this
# hardware -- describes itself as "Gamescope Steam session with OpenGamepadUI
# QAM". It means it: OGUI treats `Guide`+`East` as its own quick-bar gesture
# and answers it before Steam ever sees it. Measured on the device: the chord
# is emitted cleanly, seven presses out of seven, and opens OGUI's panel.
#
# So reaching Steam's own QAM needs two things together, and this file is one
# of them. The other is `ujust configure-opengamepadui disable`, which turns
# that session into plain Steam. With OGUI gone nothing reasserts the target
# list any more, which is why this now sticks where it previously did not.
#
# `deck-uhid` presents "Valve Steam Deck Controller", which has a real
# QuickAccess button for the capability map to aim at.
target_devices:
  - deck-uhid
  - mouse
  - keyboard

capability_map_id: oxpf1_yaguarete
