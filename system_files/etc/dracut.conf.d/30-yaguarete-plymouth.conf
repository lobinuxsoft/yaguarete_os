# YaguareteOS: force the custom Plymouth theme into the initramfs.
#
# Bazzite/UBlue ship 20-atomic-nohostonly.conf which makes dracut run in
# non-hostonly mode. In that mode, the 45plymouth/plymouth-populate-initrd.sh
# module only installs the 'text' and 'details' themes — the configured
# default ('yaguarete') is silently skipped, so the user sees the upstream
# fallback (Plymouth detail log) instead of our jaguar splash.
#
# Explicit install_items+= bypasses that path: dracut copies the listed
# files verbatim into the initramfs regardless of hostonly mode. The
# two-step.so module is required because yaguarete.plymouth declares
# ModuleName=two-step.

install_items+=" /usr/lib64/plymouth/two-step.so "
install_items+=" /usr/share/plymouth/themes/yaguarete/yaguarete.plymouth "
install_items+=" /usr/share/plymouth/themes/yaguarete/watermark.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0001.png /usr/share/plymouth/themes/yaguarete/throbber-0002.png /usr/share/plymouth/themes/yaguarete/throbber-0003.png /usr/share/plymouth/themes/yaguarete/throbber-0004.png /usr/share/plymouth/themes/yaguarete/throbber-0005.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0006.png /usr/share/plymouth/themes/yaguarete/throbber-0007.png /usr/share/plymouth/themes/yaguarete/throbber-0008.png /usr/share/plymouth/themes/yaguarete/throbber-0009.png /usr/share/plymouth/themes/yaguarete/throbber-0010.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0011.png /usr/share/plymouth/themes/yaguarete/throbber-0012.png /usr/share/plymouth/themes/yaguarete/throbber-0013.png /usr/share/plymouth/themes/yaguarete/throbber-0014.png /usr/share/plymouth/themes/yaguarete/throbber-0015.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0016.png /usr/share/plymouth/themes/yaguarete/throbber-0017.png /usr/share/plymouth/themes/yaguarete/throbber-0018.png /usr/share/plymouth/themes/yaguarete/throbber-0019.png /usr/share/plymouth/themes/yaguarete/throbber-0020.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0021.png /usr/share/plymouth/themes/yaguarete/throbber-0022.png /usr/share/plymouth/themes/yaguarete/throbber-0023.png /usr/share/plymouth/themes/yaguarete/throbber-0024.png /usr/share/plymouth/themes/yaguarete/throbber-0025.png "
install_items+=" /usr/share/plymouth/themes/yaguarete/throbber-0026.png /usr/share/plymouth/themes/yaguarete/throbber-0027.png /usr/share/plymouth/themes/yaguarete/throbber-0028.png /usr/share/plymouth/themes/yaguarete/throbber-0029.png /usr/share/plymouth/themes/yaguarete/throbber-0030.png "
