# HHD daemon distro detection override.
#
# hhd-dev/hhd does not include "yaguarete" in DISTRO_NAMES (utils.py)
# and hhd-ui/src/components/theme.tsx has no yaguarete case either.
# Instead of forking, we instruct the daemon to report `blood_orange`
# — the closest existing palette to yaguareté #FF4500 (brand `#f06429`).
# blood_orange does NOT trigger the bazzite logo branch in hhd-ui Logo()
# (theme.includes("_ba") gate), so the overlay renders the neutral HHD
# wordmark hue-rotated orange + orange scrollbars/backgrounds.
#
# /etc/environment.d/*.conf does NOT propagate to system services —
# only to systemd --user — so a systemd drop-in is the canonical path.
# Confirmed by `man systemd.environment-d-generator`.

[Service]
Environment="HHD_DISTRO=blood_orange"
