# YaguareteOS env vars consumed by system services.
#
# HHD_DISTRO overrides the auto-detection done by the hhd daemon (which scans
# /etc/os-release ID against a hardcoded DISTRO_NAMES tuple in
# /usr/lib/python*/site-packages/hhd/utils.py). Until upstream hhd-dev adds
# "yaguarete" to that tuple, we set the env var so the daemon reports the
# correct distro to its UI without patching the package itself (which would
# break on every hhd package upgrade).
HHD_DISTRO=yaguarete
