# Panel rotation for handhelds gamescope does not know about.
#
# Bazzite 44 retired Handheld Daemon on the deck image in favour of
# InputPlumber + OpenGamepadUI. HHD used to rotate portrait panels; the job now
# belongs to /usr/share/gamescope-session-plus/device-quirks, which matches on
# the DMI product name.
#
# That file lists "ONEXPLAYER F1" and its EVA/OLED siblings but not
# "ONEXPLAYER F1Pro", so nothing rotates the F1 Pro and gamescope draws its
# native 1080x1920 panel upright — the whole UI lands sideways.
#
# gamescope-session-plus sources device-quirks first and this directory after,
# so setting ORIENTATION here wins without forking the upstream file, and the
# fix survives a device-quirks update that finally adds the device.
#
# left is what every OXP entry in device-quirks uses.
#
# Guarded by DMI: on any other machine this file sets nothing at all, which is
# what keeps it safe to ship in the image rather than per-device.

case "$(cat /sys/devices/virtual/dmi/id/product_name 2>/dev/null)" in
    "ONEXPLAYER F1Pro")
        ORIENTATION=left
        ;;
esac
