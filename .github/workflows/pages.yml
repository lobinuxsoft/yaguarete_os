# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Build and deploy the YaguareteOS landing (Astro + Tailwind + GSAP)
# to GitHub Pages. Replaces the legacy Jekyll/Cayman deploy that
# happened automatically from the `unstable/docs` source.
#
# Pages source must be configured to "GitHub Actions" in repo
# settings for this workflow to publish; configured via:
#   gh api -X PUT repos/lobinuxsoft/yaguarete_os/pages \
#     -f build_type=workflow
name: Deploy Pages

on:
  push:
    branches: [unstable]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions: {}

# Only one Pages deployment at a time, but don't cancel in-flight runs —
# losing a deploy half-way leaves stale CDN content.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build Astro site
        run: pnpm build
        working-directory: web

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
