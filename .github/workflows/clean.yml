# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# GHCR retention (Bazzite `clean.yml` analogue). Multi-variant matrix.
# Policy: delete tags older than 90 days; keep the most recent 7 tagged
# and 7 untagged manifests regardless of age; also delete orphans.
name: Cleanup Old Images

on:
  schedule:
    - cron: "15 0 * * 0" # 00:15 UTC on Sundays (Bazzite-literal)
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete Images Older Than 90 Days
        uses: dataaxiom/ghcr-cleanup-action@34a2b6c814b9c6bcb92f78cba3e56a7ab9ca7a86 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: yaguarete_os,yaguarete_os-nvidia,yaguarete_os-nvidia-open,yaguarete_os-deck
          older-than: 90 days
          delete-orphaned-images: true
          keep-n-tagged: 7
          keep-n-untagged: 7
