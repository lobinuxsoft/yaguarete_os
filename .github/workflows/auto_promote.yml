# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Monthly auto-promote unstable → stable, gated by an asset-level smoke
# check on the four :unstable container images.
#
# Closes #146.
#
# Pipeline
# --------
# 1. diff-gate   — skip the month if `unstable` is unchanged since the
#                  last `stable-*` git tag. No PR, no notification, no
#                  failure (this is the expected "nothing to ship" path).
# 2. smoke       — pull each `ghcr.io/lobinuxsoft/<variant>:unstable`,
#                  run a checklist of YaguareteOS-specific assets inside
#                  the container (recipes, branding, services, yafti).
#                  Anything missing aborts the promote — Fedora and
#                  Bazzite already cover their own smoke; we only assert
#                  what we ship downstream.
# 3. promote-to-testing — `skopeo copy` the `:unstable` digest onto
#                  `:testing` for each variant. Zero rebuild.
# 4. retag-stable — `gh workflow run retag.yml` which promotes
#                  `:testing` → `:stable-<fedora>.<YYYYMMDD>` + `:stable`
#                  + `:latest` (same path the maintainer uses by hand).
# 5. generate-release — sleep until retag finishes, then dispatch
#                  generate_release.yml so the git tag + GitHub Release
#                  land with the new stable digests.
# 6. notify      — open an issue summarising the cut and reminding the
#                  maintainer to upload the four stable ISOs to
#                  archive.org (still manual: the LAN upload is faster
#                  from a local connection than from a CI runner).
#
# Override the cron at any time via workflow_dispatch with `force=true`
# to push out an unscheduled stable.

name: Auto-promote stable

on:
  schedule:
    # Day 1 of every month at 06:00 UTC (03:00 ART / 09:00 PST winter)
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Promote even if no commits since the last stable tag'
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: auto-promote-stable
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io/lobinuxsoft
  IMAGE_VARIANTS: 'yaguarete_os yaguarete_os-nvidia yaguarete_os-nvidia-open yaguarete_os-deck'

jobs:
  diff-gate:
    name: Should we promote this month?
    runs-on: ubuntu-24.04
    outputs:
      should_promote: ${{ steps.diff.outputs.should_promote }}
      commits_since: ${{ steps.diff.outputs.commits_since }}
      last_stable: ${{ steps.diff.outputs.last_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: unstable

      - name: Compare unstable HEAD against last stable tag
        id: diff
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail

          last_stable=$(git tag -l 'stable-*' | sort -V | tail -1 || true)
          if [ -z "$last_stable" ]; then
            # No stable tag yet — count everything on the branch.
            last_stable="(none)"
            commits=$(git rev-list --count HEAD)
          else
            commits=$(git rev-list --count "${last_stable}..HEAD")
          fi

          echo "last_stable=${last_stable}" >> "$GITHUB_OUTPUT"
          echo "commits_since=${commits}"   >> "$GITHUB_OUTPUT"

          if [ "$commits" -gt 0 ] || [ "$FORCE" = "true" ]; then
            echo "should_promote=true"  >> "$GITHUB_OUTPUT"
            echo ":rocket: ${commits} commits since ${last_stable} — promoting."
          else
            echo "should_promote=false" >> "$GITHUB_OUTPUT"
            echo ":sleeping: No commits since ${last_stable} — skipping this month."
          fi

  smoke:
    name: Smoke check ${{ matrix.variant }}
    needs: diff-gate
    if: needs.diff-gate.outputs.should_promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - yaguarete_os
          - yaguarete_os-nvidia
          - yaguarete_os-nvidia-open
          - yaguarete_os-deck
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login -u "${{ github.actor }}" --password-stdin ghcr.io

      - name: Pull image
        run: podman pull "${IMAGE_REGISTRY}/${{ matrix.variant }}:unstable"

      - name: Check YaguareteOS-specific assets
        run: |
          podman run --rm "${IMAGE_REGISTRY}/${{ matrix.variant }}:unstable" bash -euxc '
            # Recipes shipped by YaguareteOS
            for f in 85-yaguarete-install-eden \
                     85-yaguarete-install-antigravity-ide \
                     85-yaguarete-install-antigravity-cli \
                     95-yaguarete \
                     99-yaguarete-rename \
                     99-yaguarete-rescue; do
              test -f "/usr/share/ublue-os/just/${f}.just"
            done

            # Master justfile imports our recipes (glob registered in build.sh)
            grep -q "yaguarete" /usr/share/ublue-os/justfile

            # Branding webms
            test -f /usr/share/ublue-os/bazzite/bazzite.webm
            test -f /usr/share/ublue-os/bazzite/bazzite-suspend.webm
            test -f /usr/share/ublue-os/bazzite/bazzite-suspend-oled.webm

            # systemd user service for Steam branding refresh on login
            test -f /usr/lib/systemd/user/yaguarete-steam-brand-refresh.service
            test -L /usr/lib/systemd/user/default.target.wants/yaguarete-steam-brand-refresh.service

            # yafti.yml rebrand + Yaguareté Apps screen
            grep -q "Yaguareté Apps"    /usr/share/yafti/yafti.yml
            grep -q "Portal YaguareteOS" /usr/share/yafti/yafti.yml

            # Welcome banner sidecar (used by ujust yaguarete-welcome)
            test -f /usr/share/yaguarete/welcome.txt

            # Identity
            grep -q "ID=yaguarete_os" /usr/lib/os-release

            # Icons
            test -f /usr/share/icons/hicolor/scalable/apps/yaguarete-logo.svg
            test -f /usr/share/icons/hicolor/scalable/apps/yaguarete-portal.svg

            # Plymouth theme
            test -d /usr/share/plymouth/themes/yaguarete

            # uupd auto-upgrade timer enabled by build.sh (replaces bootc
            # auto-apply timer to avoid forced reboots on :unstable churn)
            test -L /etc/systemd/system/timers.target.wants/uupd.timer
            test -L /etc/systemd/system/bootc-fetch-apply-updates.timer  # masked

            # autologin service shipped by us
            test -f /usr/lib/systemd/system/yaguarete-autologin.service

            echo "  All YaguareteOS-specific assets present in ${{ matrix.variant }}:unstable"
          '

  promote-to-testing:
    name: Tag :unstable digest as :testing (${{ matrix.variant }})
    needs: [diff-gate, smoke]
    if: needs.diff-gate.outputs.should_promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - yaguarete_os
          - yaguarete_os-nvidia
          - yaguarete_os-nvidia-open
          - yaguarete_os-deck
    steps:
      - name: Install skopeo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | skopeo login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Copy :unstable digest to :testing
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${{ matrix.variant }}"
          src_digest=$(skopeo inspect "docker://${image}:unstable" --format '{{.Digest}}')
          echo "Promoting ${image}@${src_digest} → ${image}:testing"
          skopeo copy --multi-arch=all \
            "docker://${image}@${src_digest}" \
            "docker://${image}:testing"

  retag-stable:
    name: Trigger retag.yml (testing → stable)
    needs: [diff-gate, promote-to-testing]
    if: needs.diff-gate.outputs.should_promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: unstable

      - name: Dispatch retag.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run retag.yml -f include_variants=all
          echo "Dispatched retag.yml — testing digest will be tagged stable + stable-<fedora>.<YYYYMMDD> + latest."

      - name: Wait for retag to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # retag has a 30s safeguard timer + ~30s actual retag per variant.
          # Poll for up to 6 minutes.
          for attempt in $(seq 1 36); do
            sleep 10
            run=$(gh run list --workflow=retag.yml --limit=1 --json status,conclusion,databaseId --jq '.[0]')
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            echo "[$attempt/36] retag.yml status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "retag.yml finished successfully."
                exit 0
              else
                echo "retag.yml ended with ${conclusion} — aborting auto-promote."
                exit 1
              fi
            fi
          done
          echo "Timeout waiting for retag.yml (6 minutes)."
          exit 1

  generate-release:
    name: Trigger generate_release.yml
    needs: [diff-gate, retag-stable]
    if: needs.diff-gate.outputs.should_promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch generate_release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMITS: ${{ needs.diff-gate.outputs.commits_since }}
          LAST_STABLE: ${{ needs.diff-gate.outputs.last_stable }}
        run: |
          set -euo pipefail
          prologue="Automated monthly cut — ${COMMITS} commits since ${LAST_STABLE}."
          gh workflow run generate_release.yml -R "$REPO" -f handwritten="$prologue"

  notify:
    name: Notify maintainer
    needs: [diff-gate, smoke, promote-to-testing, retag-stable, generate-release]
    if: always() && needs.diff-gate.outputs.should_promote == 'true'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open success issue (upload reminder)
        if: |
          needs.smoke.result == 'success' &&
          needs.promote-to-testing.result == 'success' &&
          needs.retag-stable.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMITS: ${{ needs.diff-gate.outputs.commits_since }}
          LAST_STABLE: ${{ needs.diff-gate.outputs.last_stable }}
        run: |
          set -euo pipefail
          today=$(date +%Y-%m-%d)
          gh issue create \
            --title "auto-promote: stable cut ${today} — upload ISOs to archive.org" \
            --body "$(printf 'Auto-promote ran successfully.\n\n- commits since last stable: %s\n- previous stable: %s\n\n**Action required:** upload the 4 stable ISOs to archive.org from a local workflow (faster than re-uploading from a CI runner).' "$COMMITS" "$LAST_STABLE")" \
            --label "release"

      - name: Open failure issue
        if: |
          needs.smoke.result == 'failure' ||
          needs.promote-to-testing.result == 'failure' ||
          needs.retag-stable.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          stage="smoke"
          if [ "${{ needs.promote-to-testing.result }}" = "failure" ]; then stage="promote-to-testing"; fi
          if [ "${{ needs.retag-stable.result }}"      = "failure" ]; then stage="retag-stable"; fi
          today=$(date +%Y-%m-%d)
          gh issue create \
            --title "auto-promote: ${stage} FAILED on ${today}" \
            --body "Cron auto-promote failed at the **${stage}** stage. The workflow run log has the details; manual review required before the next attempt." \
            --label "bug"
