# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Manual stable promotion (Bazzite `generate_release.yml` analogue).
#
# Flow:
#   1. retag.yml is run first to promote `:testing` image digests to
#      `:stable-<fedora>.<YYYYMMDD>` + `:stable` + `:latest` in GHCR.
#   2. This workflow then creates the git tag + GitHub Release pointing
#      at the corresponding commit on `testing`, with release notes
#      autogenerated by GitHub from commits/PRs since the previous tag.
#
# changelog.py from upstream Bazzite is intentionally NOT ported — that
# 548-line script diffs RPM packages between GHCR images and is overkill
# for a thin overlay like YaguareteOS. If we later need per-package
# diffs in release notes, port it in a separate PR.
name: Generate Release

on:
  workflow_dispatch:
    inputs:
      handwritten:
        description: 'Optional prologue prepended to the auto-generated release notes'
        required: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      # actions: read so we can `gh run download` the ISOs that the
      # most recent build-iso run on `testing` produced.
      actions: read
    steps:
      - name: Checkout testing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: testing
          fetch-depth: 0

      - name: Derive stable tag from :testing image
        id: derive
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ github.event.repository.name }}
        run: |
          set -eo pipefail
          OWNER_LC="${OWNER,,}"
          IMAGE_LC="${IMAGE,,}"
          REGISTRY_IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_LC}"

          skopeo inspect "docker://${REGISTRY_IMAGE}:testing" > testing.json
          DISPLAY_VERSION=$(jq -r '.Labels["org.opencontainers.image.version"]' testing.json)
          if [ -z "$DISPLAY_VERSION" ] || [ "$DISPLAY_VERSION" = "null" ]; then
            echo "::error:::testing image lacks org.opencontainers.image.version label — run retag.yml first or wait for next testing build"
            exit 1
          fi
          FEDORA_VERSION="${DISPLAY_VERSION%%.*}"

          # Stable git tag mirrors the GHCR `:stable-<fedora>.<YYYYMMDD>`
          # pointer retag.yml just published. Re-dispatching this workflow
          # on the same testing digest re-creates the same tag — the
          # `softprops/action-gh-release` step below is idempotent and
          # updates the existing release in place (Bazzite pattern).
          STABLE_TAG="stable-${DISPLAY_VERSION}"

          {
            echo "stable_tag=$STABLE_TAG"
            echo "display_version=$DISPLAY_VERSION"
            echo "fedora_version=$FEDORA_VERSION"
            echo "registry_image=$REGISTRY_IMAGE"
            echo "title=YaguareteOS Stable F${FEDORA_VERSION} (${STABLE_TAG#stable-})"
          } >> $GITHUB_OUTPUT

      - name: Build release body
        id: body
        env:
          HANDWRITTEN: ${{ inputs.handwritten }}
          STABLE_TAG: ${{ steps.derive.outputs.stable_tag }}
          DISPLAY_VERSION: ${{ steps.derive.outputs.display_version }}
          FEDORA: ${{ steps.derive.outputs.fedora_version }}
          REGISTRY_IMAGE: ${{ steps.derive.outputs.registry_image }}
        run: |
          set -eo pipefail
          NOTES=$(mktemp)
          if [ -n "$HANDWRITTEN" ]; then
            printf '%s\n\n---\n\n' "$HANDWRITTEN" >> "$NOTES"
          fi
          {
            printf '## Image\n\n'
            printf -- '- Pull: `%s:%s`\n' "$REGISTRY_IMAGE" "$STABLE_TAG"
            printf -- '- Channel pointers: `%s:stable`, `%s:latest`, `%s:stable-%s`\n' "$REGISTRY_IMAGE" "$REGISTRY_IMAGE" "$REGISTRY_IMAGE" "$FEDORA"
            printf -- '- Build: YaguareteOS `%s` (Fedora %s), tracking `ghcr.io/ublue-os/bazzite:stable`\n\n' "$DISPLAY_VERSION" "$FEDORA"
          } >> "$NOTES"
          echo "notes_file=$NOTES" >> $GITHUB_OUTPUT

      # Idempotent release upsert. Mirrors Bazzite upstream
      # (ublue-os/bazzite/.github/workflows/generate_release.yml). Re-runs
      # over an existing tag update the release in place — no `.N`
      # collision suffix needed. `generate_release_notes: true` is the
      # action's equivalent of `gh release create --generate-notes`.
      - name: Create git tag + GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.derive.outputs.stable_tag }}
          target_commitish: testing
          name: ${{ steps.derive.outputs.title }}
          body_path: ${{ steps.body.outputs.notes_file }}
          generate_release_notes: true
          make_latest: 'true'

      # archive.org upload of the four stable ISOs. Each release gets its
      # own dated identifier (Garuda-style permanent history), so older
      # releases stay accessible at their original URLs and the new one
      # appears alongside them in the lobinuxsoft creator page.
      #
      # We download the ISOs from the latest successful build-iso run on
      # `testing` (the run that produced the very digests retag.yml just
      # promoted). If the maintainer's archive.org secrets are missing or
      # the build-iso run is missing some variant (e.g. the deck variant
      # is currently broken — see #112), we skip that one gracefully.
      - name: Download ISOs from latest testing build-iso run
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          RUN_ID=$(gh run list \
            --workflow=build-iso.yml \
            --branch=testing \
            --status=success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            # Build-iso may have completed with failure (e.g. one variant broken
            # while the others published artifacts). Fall back to the most
            # recent run, success-or-not — `gh run download` only pulls the
            # artifacts that actually exist.
            RUN_ID=$(gh run list \
              --workflow=build-iso.yml \
              --branch=testing \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No build-iso run found on testing branch."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT

          mkdir -p iso_artifacts
          gh run download "$RUN_ID" --dir iso_artifacts || true
          echo "::notice::Downloaded artifacts from build-iso run $RUN_ID"
          ls -lh iso_artifacts/ || true

      - name: Render archive.org thumbnail from logo SVG
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends imagemagick librsvg2-bin
          mkdir -p thumbs
          # 1024x1024 with the page background colour (#1A1A1A) baked in
          # so the thumbnail reads cleanly on archive.org's white listings
          # as well as our own black landing.
          # `convert` is the IM6 binary (Ubuntu noble apt) and an alias in
          # IM7; `magick` exists only in IM7 and is not available here.
          convert -background "#1A1A1A" -density 192 -resize 1024x1024 \
            system_files/usr/share/yaguarete/branding/yaguarete_os_vector_01.svg \
            thumbs/__ia_thumb.png
          ls -lh thumbs/__ia_thumb.png

      - name: Upload stable ISOs to archive.org
        env:
          IA_ACCESS_KEY: ${{ secrets.ARCHIVE_ORG_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.ARCHIVE_ORG_SECRET_KEY }}
          DISPLAY_VERSION: ${{ steps.derive.outputs.display_version }}
          FEDORA: ${{ steps.derive.outputs.fedora_version }}
          STABLE_TAG: ${{ steps.derive.outputs.stable_tag }}
        run: |
          set -eo pipefail
          if [ -z "$IA_ACCESS_KEY" ] || [ -z "$IA_SECRET_KEY" ]; then
            echo "::warning::archive.org keys missing (ARCHIVE_ORG_ACCESS_KEY / ARCHIVE_ORG_SECRET_KEY). Skipping upload — the GitHub Release with ghcr.io pulls still works."
            exit 0
          fi

          python3 -m pip install --user --quiet internetarchive
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p "$HOME/.config/internetarchive"
          cat > "$HOME/.config/internetarchive/ia.ini" <<INI
          [s3]
          access = ${IA_ACCESS_KEY}
          secret = ${IA_SECRET_KEY}
          INI
          chmod 0600 "$HOME/.config/internetarchive/ia.ini"

          # variant key → friendly label that goes into the archive.org
          # metadata title / description / subject.
          declare -A LABELS=(
            ["yaguarete_os"]="desktop"
            ["yaguarete_os-nvidia"]="nvidia"
            ["yaguarete_os-nvidia-open"]="nvidia-open"
            ["yaguarete_os-deck"]="deck"
          )

          overall_status=0

          for variant in "${!LABELS[@]}"; do
            label="${LABELS[$variant]}"
            # Build-iso names its artifact "<variant>-<filename_tag>-iso";
            # `gh run download` extracts each into a dir named after the
            # artifact, so iso_artifacts/<variant>-<filename_tag>-iso/.iso.
            iso_dir=$(find iso_artifacts -maxdepth 1 -type d -name "${variant}-*-iso" | head -1)
            if [ -z "$iso_dir" ] || [ -z "$(ls -A "$iso_dir"/*.iso 2>/dev/null)" ]; then
              echo "::warning::${variant} has no ISO in the artifacts (variant build likely failed); skipping archive.org upload."
              continue
            fi

            identifier="${variant}-stable-${DISPLAY_VERSION}"
            iso_file=$(ls "$iso_dir"/*.iso | head -1)
            sum_file="${iso_file}-CHECKSUM"
            meta_file="${iso_file}.json"

            # Copy the rendered thumb into the artifact dir so it ships in
            # the same `ia upload` invocation as the ISO + sidecars.
            cp thumbs/__ia_thumb.png "${iso_dir}/__ia_thumb.png"

            echo "::group::Upload ${variant} → ${identifier}"
            upload_ok=true
            ia upload "$identifier" \
              "$iso_file" "$sum_file" "$meta_file" "${iso_dir}/__ia_thumb.png" \
              --no-derive \
              --metadata="title:YaguareteOS ${label} ${STABLE_TAG#stable-}" \
              --metadata="creator:lobinuxsoft" \
              --metadata="description:YaguareteOS ${label} variant — stable release ${STABLE_TAG#stable-}. Bootable ISO, offline installable. Source: https://github.com/lobinuxsoft/yaguarete_os" \
              --metadata="subject:linux;distro;bazzite;yaguarete;gaming;kde;${label}" \
              --metadata="licenseurl:https://www.apache.org/licenses/LICENSE-2.0" \
              --metadata="mediatype:software" \
              --metadata="collection:opensource" \
              || upload_ok=false

            # `ia upload` sometimes exits 1 after the upload actually
            # succeeded (race against archive.org's bucket allocation,
            # observed in #115). Confirm via the metadata API that the
            # item exists with an .iso file before treating it as a fail.
            if ! $upload_ok; then
              echo "ia upload returned non-zero. Verifying item via metadata API..."
              sleep 15
              if curl -fsSL "https://archive.org/metadata/${identifier}" 2>/dev/null \
                  | jq -e '(.files // []) | map(select(.name | endswith(".iso"))) | length > 0' >/dev/null; then
                echo "::notice::Item ${identifier} verified — soft-fail tolerated."
              else
                echo "::error::Item ${identifier} not present after upload."
                overall_status=1
              fi
            fi

            echo "Published https://archive.org/details/${identifier}"
            echo "::endgroup::"
          done

          rm -f "$HOME/.config/internetarchive/ia.ini"
          exit $overall_status
