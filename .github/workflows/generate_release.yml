# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Manual stable promotion (Bazzite `generate_release.yml` analogue).
#
# Flow:
#   1. retag.yml is run first to promote `:testing` image digests to
#      `:stable-<fedora>.<YYYYMMDD>` + `:stable` + `:latest` in GHCR.
#   2. This workflow then creates the git tag + GitHub Release pointing
#      at the corresponding commit on `testing`, with release notes
#      autogenerated by GitHub from commits/PRs since the previous tag.
#
# ISOs are NOT published from here. archive.org throttles a multi-GB
# transfer down to ~1 MiB/s, which puts ~40 GB of ISOs well past the
# 360-minute job cap (#234). Publishing is a manual operator step —
# see docs/release-isos.md and scripts/publish-isos.sh.
#
# changelog.py from upstream Bazzite is intentionally NOT ported — that
# 548-line script diffs RPM packages between GHCR images and is overkill
# for a thin overlay like YaguareteOS. If we later need per-package
# diffs in release notes, port it in a separate PR.
name: Generate Release

on:
  workflow_dispatch:
    inputs:
      handwritten:
        description: 'Optional prologue prepended to the auto-generated release notes'
        required: false
      allow_testing_drift:
        description: 'Release even if :testing has moved past the digest currently on :stable'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  generate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout testing
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: testing
          fetch-depth: 0

      - name: Derive stable tag from :stable image
        id: derive
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ github.event.repository.name }}
          ALLOW_DRIFT: ${{ inputs.allow_testing_drift }}
        run: |
          set -eo pipefail
          OWNER_LC="${OWNER,,}"
          IMAGE_LC="${IMAGE,,}"
          REGISTRY_IMAGE="ghcr.io/${OWNER_LC}/${IMAGE_LC}"

          # Invariant: the release describes what `retag.yml` promoted to
          # `:stable`, so `:stable` IS the source of the version. Reading
          # `:testing` instead assumed nothing rebuilds that branch between
          # retag and release — an assumption about timing, not a fact, and
          # it produced two releases for one cycle on 2026-07-30 (#232).
          if ! skopeo inspect "docker://${REGISTRY_IMAGE}:stable" > stable.json; then
            echo "::error::No :stable image in GHCR — run retag.yml before this workflow"
            exit 1
          fi
          DISPLAY_VERSION=$(jq -r '.Labels["org.opencontainers.image.version"]' stable.json)
          if [ -z "$DISPLAY_VERSION" ] || [ "$DISPLAY_VERSION" = "null" ]; then
            echo "::error:::stable image lacks org.opencontainers.image.version label — re-run retag.yml"
            exit 1
          fi
          FEDORA_VERSION="${DISPLAY_VERSION%%.*}"

          # `:stable` should still point at the digest `:testing` carried
          # when retag ran. A mismatch means either retag was never run for
          # this cycle, or testing moved on afterwards — both make the
          # release notes (generated from the `testing` branch) describe
          # commits that are not in the promoted image. Stop instead of
          # publishing something inconsistent.
          STABLE_DIGEST=$(jq -r '.Digest' stable.json)
          TESTING_DIGEST=$(skopeo inspect "docker://${REGISTRY_IMAGE}:testing" | jq -r '.Digest')
          if [ "$STABLE_DIGEST" != "$TESTING_DIGEST" ]; then
            if [ "$ALLOW_DRIFT" = "true" ]; then
              echo "::warning::testing ($TESTING_DIGEST) has drifted from stable ($STABLE_DIGEST); releasing anyway on operator request"
            else
              echo "::error:::stable ($STABLE_DIGEST) and :testing ($TESTING_DIGEST) differ. Run retag.yml to promote the current testing digest, or re-dispatch with allow_testing_drift=true to release the digest already on :stable."
              exit 1
            fi
          fi

          # Stable git tag mirrors the GHCR `:stable-<fedora>.<YYYYMMDD>`
          # pointer retag.yml published. Re-dispatching over an unchanged
          # `:stable` re-derives the same tag — the
          # `softprops/action-gh-release` step below is idempotent and
          # updates the existing release in place (Bazzite pattern).
          STABLE_TAG="stable-${DISPLAY_VERSION}"

          {
            echo "stable_tag=$STABLE_TAG"
            echo "display_version=$DISPLAY_VERSION"
            echo "fedora_version=$FEDORA_VERSION"
            echo "registry_image=$REGISTRY_IMAGE"
            echo "title=YaguareteOS Stable F${FEDORA_VERSION} (${STABLE_TAG#stable-})"
          } >> $GITHUB_OUTPUT

      - name: Build release body
        id: body
        env:
          HANDWRITTEN: ${{ inputs.handwritten }}
          STABLE_TAG: ${{ steps.derive.outputs.stable_tag }}
          DISPLAY_VERSION: ${{ steps.derive.outputs.display_version }}
          FEDORA: ${{ steps.derive.outputs.fedora_version }}
          REGISTRY_IMAGE: ${{ steps.derive.outputs.registry_image }}
        run: |
          set -eo pipefail
          NOTES=$(mktemp)
          if [ -n "$HANDWRITTEN" ]; then
            printf '%s\n\n---\n\n' "$HANDWRITTEN" >> "$NOTES"
          fi
          {
            printf '## Image\n\n'
            printf -- '- Pull: `%s:%s`\n' "$REGISTRY_IMAGE" "$STABLE_TAG"
            printf -- '- Channel pointers: `%s:stable`, `%s:latest`, `%s:stable-%s`\n' "$REGISTRY_IMAGE" "$REGISTRY_IMAGE" "$REGISTRY_IMAGE" "$FEDORA"
            printf -- '- Build: YaguareteOS `%s` (Fedora %s), tracking `ghcr.io/ublue-os/bazzite:stable`\n\n' "$DISPLAY_VERSION" "$FEDORA"
          } >> "$NOTES"
          echo "notes_file=$NOTES" >> $GITHUB_OUTPUT

      # Idempotent release upsert. Mirrors Bazzite upstream
      # (ublue-os/bazzite/.github/workflows/generate_release.yml). Re-runs
      # over an existing tag update the release in place — no `.N`
      # collision suffix needed. `generate_release_notes: true` is the
      # action's equivalent of `gh release create --generate-notes`.
      - name: Create git tag + GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ steps.derive.outputs.stable_tag }}
          target_commitish: testing
          name: ${{ steps.derive.outputs.title }}
          body_path: ${{ steps.body.outputs.notes_file }}
          generate_release_notes: true
          make_latest: 'true'
