[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hhd-vram"
version = "0.1.0"
description = "Handheld Daemon plugin to allocate system RAM as GPU graphics memory (GTT) on AMD APUs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lobinuxsoft" }]
dependencies = ["hhd"]

[project.urls]
Homepage = "https://github.com/lobinuxsoft/hhd-vram"

# HHD discovers plugins through this setuptools entry point group.
# `hhd_vram:autodetect` -> module `hhd_vram`, function `autodetect`.
[project.entry-points."hhd.plugins"]
hhd_vram = "hhd_vram:autodetect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hhd_vram = ["*.yml"]
