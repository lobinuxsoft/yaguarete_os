# Anaconda configuration file for YaguareteOS

[Profile]
# Define the profile.
profile_id = yaguarete

[Profile Detection]
# Match os-release values
os_id = yaguarete

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network
hidden_spokes =
    PasswordSpoke
custom_stylesheet = /usr/share/anaconda/yaguarete-branding.css

[Localization]
use_geolocation = False
