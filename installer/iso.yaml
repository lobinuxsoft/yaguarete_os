label: "YaguareteOS-Live"
grub2:
  timeout: 3
  entries:
    - name: "Launch YaguareteOS Installer"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=YaguareteOS-Live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch YaguareteOS Installer (Basic Graphics Mode)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=YaguareteOS-Live enforcing=0 rd.live.image nomodeset"
      initrd: "/images/pxeboot/initrd.img"
