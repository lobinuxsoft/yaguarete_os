# Jekyll configuration for GitHub Pages.
#
# Kept minimal on purpose: a built-in theme (Cayman) renders the markdown
# directly without us shipping our own build pipeline. GitHub Pages compiles
# this on every push to the configured source branch — no CI workflow needed
# from our side.
#
# When the docs site grows beyond a single landing page, we will swap in a
# proper static site generator (#21) and this file gets replaced.

title: YaguareteOS
description: Distribución bootc Linux para gaming, desarrollo y privacidad. Identidad cultural argentina. Construida sobre Bazzite.

# Cayman: clean, single-page friendly, dark mode safe.
# https://pages-themes.github.io/cayman/
theme: jekyll-theme-cayman

# Disable Jekyll's default URL rewriting on a few file types we serve raw.
include:
  - _config.yml

# Markdown processing matches GitHub's own renderer so previews on GitHub
# UI and on the published site stay consistent.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
